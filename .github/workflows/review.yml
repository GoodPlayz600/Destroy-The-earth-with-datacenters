name: Game review

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    name: Review on ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.browser == 'chromium'
        with:
          name: Project-Clearcut-Web
          path: dist/
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        run: xvfb-run --auto-servernum env HEADED=1 npm run test:browser
      - if: matrix.browser == 'firefox'
        run: xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 HEADED=1 BROWSER=firefox npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Review-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
